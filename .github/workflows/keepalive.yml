# Checks the live site every 6 hours and fails loudly if it's down.
name: keepalive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 -o /dev/null "${{ vars.HF_SPACE_URL }}/sample/summary.json"
